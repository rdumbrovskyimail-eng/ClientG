# ====================================================================
# Выделение памяти JVM (критично для компиляции Jetpack Compose и K2)
# ====================================================================
# 3072 МБ достаточно для быстрой сборки без перегрузки памяти на CI и ноутбуках
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ====================================================================
# Производительность сборщика Gradle 9.x
# ====================================================================
# Параллельная сборка независимых задач
org.gradle.parallel=true

# Локальный сборочный кэш (не пересобирает неизмененный код)
org.gradle.caching=true

# Кэширование графа конфигурации (дает мгновенный запуск повторных сборок)
org.gradle.configuration-cache=true

# Отслеживание изменений файловой системы (FileSystem Watching)
org.gradle.vfs.watch=true

# ====================================================================
# Настройки Android Gradle Plugin (AGP 9.x)
# ====================================================================
# Использование библиотек AndroidX
android.useAndroidX=true

# Изолированные R-классы (значительно ускоряет инкрементальную компиляцию)
android.nonTransitiveRClass=true

# Полнофункциональный режим оптимизатора R8 при релизной сборке
android.enableR8.fullMode=true

# Отключение генерации пустого BuildConfig по умолчанию (ускоряет сборку)
android.defaults.buildfeatures.buildconfig=false

# ====================================================================
# Настройки компилятора Kotlin 2.4.x
# ====================================================================
kotlin.code.style=official
kotlin.incremental=true

# Выделение памяти под демон Kotlin
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8