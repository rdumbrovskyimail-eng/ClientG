name: CI - Build ClientG APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Fast Checkout (depth=1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Активируем полное кэширование зависимостей и графа конфигурации
      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: 'ClientG-Static-Deterministic-Key-2026'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Запуск сборки без --no-daemon (демон переиспользует прогретую память JVM)
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # Привязываем имя артефакта к точному хэшу коммита (исключает путаницу с версиями)
      - name: Upload Verified Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ClientG-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7